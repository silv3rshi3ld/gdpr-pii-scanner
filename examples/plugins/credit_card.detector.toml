# The all-zero example is synthetic and is not an issued payment-card number.
schema_version = 1
id = "example_payment_card"
name = "Example payment-card number"
country = "universal"
category = "financial"
description = "Matches a 16-digit card shape and applies Luhn validation."
severity = "high"
examples = ["0000 0000 0000 0000"]
context_keywords = ["card", "payment", "expiry"]

[[patterns]]
pattern = "\\b\\d{4}[- ]?\\d{4}[- ]?\\d{4}[- ]?\\d{4}\\b"
confidence = "medium"
description = "Sixteen digits with optional spaces or hyphens."

[validation]
min_length = 16
max_length = 19
checksum = "luhn"
