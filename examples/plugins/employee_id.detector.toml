schema_version = 1
id = "example_employee_id"
name = "Example employee identifier"
country = "universal"
category = "custom"
description = "Matches a synthetic organisation-specific employee format."
severity = "medium"
examples = ["EMP-000001"]
context_keywords = ["employee", "staff", "payroll"]

[[patterns]]
pattern = "\\bEMP-\\d{6}\\b"
confidence = "high"
description = "EMP prefix followed by six digits."

[validation]
min_length = 10
max_length = 10
required_prefix = "EMP-"
