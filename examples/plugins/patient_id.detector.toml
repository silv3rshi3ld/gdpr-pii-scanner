schema_version = 1
id = "example_patient_id"
name = "Example patient identifier"
country = "universal"
category = "healthcare_identifier"
description = "Matches a synthetic patient reference format."
severity = "high"
examples = ["PAT-00000001"]
context_keywords = ["patient", "clinic", "record"]

[[patterns]]
pattern = "\\bPAT-\\d{8}\\b"
confidence = "high"
description = "PAT prefix followed by eight digits."

[validation]
min_length = 12
max_length = 12
required_prefix = "PAT-"
