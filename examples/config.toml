# Synthetic PII Radar 0.6 common configuration.
# Copy to ./.pii-radar.toml, the platform user configuration path, or load it
# as an additional layer with `pii-radar --config PATH ...`.

[scan]
min_confidence = "high"
extract_documents = false
max_threads = 4
countries = ["de", "nl"]
no_context = false
include_redacted_snippets = false

[output]
format = "terminal"
# output_path = "findings.json"
full_paths = false
no_progress = false

[limits]
max_filesize_mb = 25
max_total_size_mb = 1024
max_files = 10000
max_depth = 8
max_matches_per_source = 1000
max_matches = 10000
max_extracted_size_mb = 25

[plugins]
enabled = true
directories = ["./plugins"]
