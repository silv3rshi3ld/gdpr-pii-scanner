[package]
name = "pii-radar"
version = "0.6.1"
edition = "2021"
rust-version = "1.88"
authors = ["PII-Radar Contributors"]
license = "Apache-2.0"
description = "PII and secret scanner for files, HTTP responses, PostgreSQL, and MongoDB"
repository = "https://github.com/silv3rshi3ld/gdpr-pii-scanner"
readme = "README.md"
keywords = ["pii", "security", "privacy", "scanner", "gdpr"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["Cargo.toml.orig"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# CLI & Argument Parsing
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "3.1"
indicatif = "0.18"

# Concurrency & Performance
rayon = "1.10"
num_cpus = "1.16"

# Regex & Pattern Matching
regex = "1.10"
once_cell = "1.19"
chrono = { version = "0.4", default-features = false, features = ["std"] }

# File System
ignore = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
toml = "1.1"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# Document Extraction
lopdf = "0.44"              # PDF text extraction
zip = "8.5"                 # DOCX and XLSX support
quick-xml = "0.41"          # XML parsing for DOCX
calamine = "0.36.1"         # Excel/XLSX parsing

# Entropy calculation
ordered-float = "5.1"

# Database connectivity (optional feature for database scanning)
# Note: MySQL support removed to eliminate rsa crate vulnerability (RUSTSEC-2023-0071)
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
mongodb = { version = "3.8", optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }

# Directories
dirs = "6.0"

# HTTP Client for API scanning
reqwest = { version = "0.13", features = ["blocking", "json"] }
url = "2.5"
tempfile = "3.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
postgres = ["dep:sqlx", "dep:tokio", "dep:futures"]
mongodb = ["dep:mongodb", "dep:tokio", "dep:futures"]
database = ["postgres", "mongodb"]

[dev-dependencies]
criterion = "0.8"
pretty_assertions = "1.4"
assert_cmd = "2.0"
predicates = "3.1"

[[bench]]
name = "scan_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1  # Faster local development builds
