name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action branch
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-validation

      - name: Require tag to match crate version
        if: github.event_name == 'push'
        shell: bash
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pii-radar") | .version')"
          if [[ "v${crate_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crate version ${crate_version}." >&2
            exit 1
          fi

      - name: Require release commit to be on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag must point to a commit reachable from main." >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint full build
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test full build
        run: cargo test --locked --workspace --all-features

      - name: Verify crate package
        run: cargo package --locked

  validate-msrv:
    name: Validate MSRV (Rust 1.88, ${{ matrix.profile.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: core
            args: --no-default-features
          - name: full
            args: --all-features
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # Rust 1.88.0 action branch

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-msrv-${{ matrix.profile.name }}

      - name: Run test suite at MSRV
        run: cargo test --locked --workspace ${{ matrix.profile.args }}

  dependency-policy:
    name: Validate dependencies, licenses, and sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  build:
    name: Build ${{ matrix.variant.name }} (${{ matrix.platform.target }})
    needs: [validate, validate-msrv, dependency-policy]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
        variant:
          - name: core
            cargo_args: --no-default-features
          - name: full
            cargo_args: --no-default-features --features database
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action branch
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.variant.name }}-${{ matrix.platform.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.platform.target }} ${{ matrix.variant.cargo_args }}

      - name: Package Unix archive
        if: matrix.platform.archive == 'tar.gz'
        shell: bash
        run: |
          package="pii-radar-${GITHUB_REF_NAME}-${{ matrix.variant.name }}-${{ matrix.platform.target }}"
          stage="${RUNNER_TEMP}/${package}"
          mkdir -p "${stage}"
          cp "target/${{ matrix.platform.target }}/release/pii-radar" "${stage}/"
          cp README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md .pii-ignore LICENSE-APACHE "${stage}/"
          cp -R docs examples "${stage}/"
          tar -C "${RUNNER_TEMP}" -czf "${package}.tar.gz" "${package}"

      - name: Package Windows archive
        if: matrix.platform.archive == 'zip'
        shell: pwsh
        run: |
          $package = "pii-radar-$env:GITHUB_REF_NAME-${{ matrix.variant.name }}-${{ matrix.platform.target }}"
          $stage = Join-Path $env:RUNNER_TEMP $package
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "target/${{ matrix.platform.target }}/release/pii-radar.exe" $stage
          Copy-Item README.md, CHANGELOG.md, CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, .pii-ignore, LICENSE-APACHE $stage
          Copy-Item docs, examples $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath "${package}.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pii-radar-${{ matrix.variant.name }}-${{ matrix.platform.target }}
          path: pii-radar-${{ github.ref_name }}-${{ matrix.variant.name }}-${{ matrix.platform.target }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        if: ${{ !contains(github.ref_name, '-') }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action branch

      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' \
            | sort \
            | while IFS= read -r artifact; do sha256sum "${artifact}"; done > SHA256SUMS
          test -s SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish stable crate when crates.io credentials are configured
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; skipping optional crates.io publication."
            exit 0
          fi
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pii-radar") | .version')"
          published_version="$(curl --fail --silent --show-error https://crates.io/api/v1/crates/pii-radar \
            | jq -r --arg version "${crate_version}" '.versions[]? | select(.num == $version) | .num' \
            || true)"
          if [[ "${published_version}" == "${crate_version}" ]]; then
            echo "pii-radar ${crate_version} is already published; continuing a release retry."
          else
            cargo publish --locked
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
